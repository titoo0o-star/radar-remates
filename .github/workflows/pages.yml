# Publica la app (app/) con los datos (data/remates.json, data/barrios.json) en GitHub Pages.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar app en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "data/remates.json", "data/barrios.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# grupo propio: no debe cancelar una corrida de "Actualizar datos" en curso
concurrency:
  group: pages-codigo
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Si ya corrió la actualización semanal, sus datos (en la caché) son más recientes que
      # los del repositorio: se usan esos para no publicar datos viejos al cambiar el código.
      - name: Datos más recientes de la actualización semanal
        uses: actions/cache/restore@v4
        with:
          # misma lista de rutas que en actualizar.yml (la caché solo se restaura si coincide)
          path: |
            data/anuncios
            data/cache
            data/remates.json
            data/remates.csv
            data/salidos.json
            data/novedades.json
            data/geocache.json
            data/mercado.json
            data/barrios.json
          key: datos-${{ github.run_id }}
          restore-keys: datos-
      - name: Armar el sitio
        run: |
          mkdir -p _site/data
          cp app/* _site/
          cp data/remates.json data/barrios.json _site/data/
          [ -f data/novedades.json ] && cp data/novedades.json _site/data/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
