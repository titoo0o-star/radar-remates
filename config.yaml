# Radar de Remates — configuración
# Cambia aquí los supuestos de costos y el alcance. Todo lo demás lee de este archivo.

# --- Supuestos para margen_neto_pct (fracciones: 0.05 = 5%) ---
costos:
  impuesto_remate: 0.05        # % del precio de compra, solo en remates judiciales
  escritura_registro: 0.02     # % del precio de compra
  remodelacion: 0.10           # % del valor de mercado
  tenencia_meses: 6
  tenencia_costo_mensual: 0.0025  # % del valor de mercado por mes
  descuento_cierre: 0.05       # el precio de cierre queda por debajo del de anuncio
  comision_venta: 0.03         # % del precio de venta

# --- Referencia de mercado ---
mercado:
  min_comparables_barrio: 5    # con menos anuncios se usa la mediana de la ciudad
  fincaraiz_max_paginas: 150   # 21 anuncios por página, por municipio y tipo
  radio_km: 1.0                # si el barrio tiene < 5 anuncios, se usan los del mismo tipo a esta
                               # distancia antes de caer a la ciudad (0 = desactivado)

# --- Red ---
http:
  pausa_min_s: 1.0
  pausa_max_s: 2.0
  timeout_s: 45
  reintentos: 3
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

# --- Fuentes activas (en el orden en que corren) ---
fuentes: [sae, bancolombia, cisa, davivienda]

# --- Alcance geográfico ---
