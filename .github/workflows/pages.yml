# Publica la app (app/) con los datos (data/remates.json, data/barrios.json) en GitHub Pages.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar app en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "data/remates.json", "data/barrios.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir -p _site/data
          cp app/* _site/
          cp data/remates.json data/barrios.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
